<style>
:root {

}
@media (prefers-color-scheme: dark) {

    --accent: #3987e5; --accent-ink: #ffffff;
    --o-pass: #4a4945; --o-held: #c98500; --o-denied: #e05555;
    --bar: #3987e5; --banner: #3a2f12; --banner-ink: #f3d89a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #3987e5; --accent-ink: #ffffff;
  --o-pass: #4a4945; --o-held: #c98500; --o-denied: #e05555;
  --bar: #3987e5; --banner: #3a2f12; --banner-ink: #f3d89a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",

}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
a { color: var(--accent); }

header.top { padding: 28px 0 8px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: .02em; color: var(--text-2); }
.tools { display: flex; gap: 6px; }
.tools button {
  font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
}
h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.2; margin: 18px 0 8px; }
.lede { color: var(--text-2); max-width: 680px; margin: 0 0 18px; }
.cta {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
  padding: 12px 20px; border-radius: 10px; font-size: 16px;
}
.cta:hover { filter: brightness(1.08); }
.cta-note { display: block; color: var(--text-3); font-size: 13px; margin-top: 8px; }
.disclaimer { color: var(--text-2); font-size: 13px; margin: 14px 0 0; padding: 8px 12px; border-left: 3px solid var(--border); background: var(--surface); border-radius: 0 8px 8px 0; }

.banner {
  background: var(--banner); color: var(--banner-ink); border-radius: 10px;
  padding: 10px 14px; font-size: 14px; margin: 18px 0 0;
}

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0 8px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .v { font-size: 30px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-2); font-size: 13px; }
.kpi .s { color: var(--text-3); font-size: 12px; }

section.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 20px 20px 18px; margin: 16px 0;
}
section.card h2 { font-size: 19px; margin: 0 0 4px; }
.sub { color: var(--text-2); font-size: 13.5px; margin: 0 0 14px; }
.note { color: var(--text-3); font-size: 12.5px; margin: 10px 0 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 28px; }
.grid2 h3, .card h3 { font-size: 14.5px; margin: 14px 0 8px; color: var(--text); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-2); margin: 0 0 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* 100% stacked outcome rows */
.srow { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 64px; gap: 10px; align-items: center; padding: 4px 0; }
.srow .lab { font-size: 13.5px; line-height: 1.3; }
.srow .lab small { color: var(--text-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.srow .val { text-align: right; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--text); }
.srow.low .lab, .srow.low .val { color: var(--text-3); }
.stack { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; }
.stack span { display: block; height: 100%; }
.srow:hover .stack, .col:hover .colbar { filter: brightness(1.08); }
.srow, .col { cursor: default; }
.valhead { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 64px; gap: 10px; font-size: 12px; color: var(--text-3); }
.valhead span:last-child { text-align: right; }

/* single-series bars */
.brow { display: grid; grid-template-columns: minmax(130px, 40%) 1fr 72px; gap: 10px; align-items: center; padding: 3px 0; }
.brow .lab { font-size: 13.5px; line-height: 1.3; }
.brow .track { height: 12px; }
.brow .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.brow .val { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }

/* weekly columns */
.trend { position: relative; }
.cols { display: flex; align-items: flex-end; gap: 3px; height: 180px; border-bottom: 1px solid var(--grid); padding-top: 6px; }
.col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.colbar { display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
.colbar span { display: block; width: 100%; }
.xaxis { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin-top: 6px; }
.ymax { position: absolute; top: 0; left: 0; font-size: 11px; color: var(--text-3); }

.more { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 6px 0 0; cursor: pointer; }

.stories { display: grid; gap: 10px; }
.story { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.story .meta { font-size: 12.5px; color: var(--text-3); margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); }
.pill.dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--c); }
.story p { margin: 0; }

details.about { font-size: 14px; color: var(--text-2); }
details.about summary { cursor: pointer; font-weight: 600; color: var(--text); }
details.about li { margin: 4px 0; }
footer { color: var(--text-3); font-size: 12.5px; padding: 20px 0 40px; text-align: center; }

#tip {
  position: fixed; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .08s;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  box-shadow: 0 6px 24px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 150px;
}
#tip b { display: block; margin-bottom: 4px; }
#tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

@media (max-width: 720px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
  section.card { padding: 16px 14px; }
  .srow, .valhead { grid-template-columns: minmax(96px, 38%) 1fr 54px; gap: 8px; }
  .brow { grid-template-columns: minmax(110px, 46%) 1fr 60px; gap: 8px; }
  .cols { height: 140px; gap: 2px; }
}
</style>
</head>

};

let lang = "zh", D = null;
try { lang = localStorage.getItem("ue-lang") || "zh"; } catch (e) {}
try { const th = localStorage.getItem("ue-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

const t = k => T[lang][k];
const L = k => {
  if (lang === "zh" || k == null) return k;
  if (EN[k]) return EN[k];
  const m = /^([A-Z]{3}) (.+)$/.exec(k);     // "LAX 洛杉矶" -> "LAX"
  return m ? m[1] : k;
};
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const OC = [["pass", "--o-pass"], ["held", "--o-held"], ["denied", "--o-denied"]];

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect(), pad = 12;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.style.opacity = 0;
function outcomeTip(title, d) {
  return `<b>${esc(title)}</b>` + OC.slice().reverse().map(([k, v]) =>
    `<div class="r"><span><i style="background:var(${v})"></i>${t(k)}</span><span>${d[k]} · ${pct(d[k], d.n)}%</span></div>`).join("") +
    `<div class="r" style="color:var(--text-3);margin-top:3px"><span>${t("n")}</span><span>${d.n}</span></div>`;
}
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => showTip(e, el._tip));
    el.addEventListener("mouseleave", hideTip);
  });
}

// ---------- renderers ----------
function stackRows(el, rows, limit) {
  if (!rows || !rows.length) { el.innerHTML = `<p class="note">—</p>`; return; }
  const draw = all => {
    const list = all || !limit ? rows : rows.slice(0, limit);
    el.innerHTML = `<div class="valhead"><span></span><span></span><span>${t("rate")}</span></div>` +
      list.map((d, i) => {
        const hr = pct(d.held + d.denied, d.n);
        return `<div class="srow${d.n < 10 ? " low" : ""}" data-tip data-i="${i}">
          <div class="lab">${esc(L(d.key))}<small>${d.n}</small></div>
          <div class="stack">${OC.map(([k, v]) => d[k] ? `<span style="width:${d[k] / d.n * 100}%;background:var(${v})"></span>` : "").join("")}</div>
          <div class="val">${hr}%</div></div>`;
      }).join("") +
      (limit && rows.length > limit ? `<button class="more" type="button">${all ? t("showLess") : t("showAll") + ` (${rows.length})`}</button>` : "");
    el.querySelectorAll(".srow").forEach(r => r._tip = outcomeTip(L(list[+r.dataset.i].key), list[+r.dataset.i]));
    bindTips(el);
    const b = el.querySelector(".more"); if (b) b.onclick = () => draw(!all);
  };
  draw(false);
}

function barRows(el, rows, denom) {
  if (!rows || !rows.length) { el.innerHTML = `<p class="note">—</p>`; return; }
  const max = Math.max(...rows.map(r => r.n));
  el.innerHTML = rows.map((d, i) => `<div class="brow" data-tip data-i="${i}">
      <div class="lab">${esc(L(d.key))}</div>
      <div class="track"><div class="fill" style="width:${d.n / max * 100}%"></div></div>
      <div class="val">${pct(d.n, denom)}%</div></div>`).join("");
  el.querySelectorAll(".brow").forEach(r => {
    const d = rows[+r.dataset.i];
    r._tip = `<b>${esc(L(d.key))}</b><div class="r"><span>${t("n")}</span><span>${d.n} / ${denom}</span></div><div class="r"><span>${t("pct")}</span><span>${pct(d.n, denom)}%</span></div>`;
  });
  bindTips(el);
}

function trend(el, weeks) {
  const max = Math.max(1, ...weeks.map(w => w.n));
  const fmt = s => { const d = new Date(s + "T00:00:00"); return lang === "zh" ? `${d.getMonth() + 1}月${d.getDate()}日` : d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  el.innerHTML = `<div class="ymax">${max}</div><div class="cols">` + weeks.map((w, i) =>
    `<div class="col" data-tip data-i="${i}"><div class="colbar" style="height:${w.n / max * 100}%">` +
    OC.map(([k, v]) => w[k] ? `<span style="flex:${w[k]} 0 0;background:var(${v})"></span>` : "").join("") +
    `</div></div>`).join("") + `</div>
    <div class="xaxis"><span>${fmt(weeks[0].week)}</span><span>${fmt(weeks[Math.floor(weeks.length / 2)].week)}</span><span>${fmt(weeks[weeks.length - 1].week)}</span></div>`;
  el.querySelectorAll(".col").forEach(c => {
    const w = weeks[+c.dataset.i];
    c._tip = outcomeTip((lang === "zh" ? "当周起始 " : "Week of ") + fmt(w.week), w);
  });
  bindTips(el);
}

function stories(el, list) {
  if (!list.length) { el.innerHTML = `<p class="note">${t("noStory")}</p>`; return; }
  const ocKey = o => o === "revoked" ? "denied" : o;
  el.innerHTML = list.map(s => `<div class="story"><div class="meta">
      <span>${esc(s.month)}</span>
      <span class="pill dot" style="--c:var(${OC.find(o => o[0] === ocKey(s.outcome))[1]})">${t(ocKey(s.outcome))}</span>
      ${[s.visa, s.role, s.major_cat, s.duration].filter(Boolean).map(x => `<span class="pill">${esc(L(x))}</span>`).join("")}
    </div><p>${esc(s.text)}</p></div>`).join("");
}

function render() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t(el.dataset.t));
  document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";
  document.querySelectorAll(".legend-outcome").forEach(el =>
    el.innerHTML = OC.map(([k, v]) => `<span><i style="background:var(${v})"></i>${t(k)}</span>`).join(""));
  if (!D) return;

  const s = D.summary;
  const banner = document.getElementById("demoBanner");
  banner.hidden = !D.demo;
  banner.textContent = t("demo");
  document.getElementById("kpis").innerHTML = [
    [s.n, t("kN"), ""],
    [pct(s.held + s.denied, s.n) + "%", t("kHeld"), t("kHeldS")],
    [pct(s.denied, s.n) + "%", t("kDen"), `${s.denied} ${t("records")}`],
    ["+" + s.last30, t("kLast"), t("kLastS")]
  ].map(([v, l, sub]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`).join("");

  trend(document.getElementById("trend"), D.trend);
  stackRows(document.getElementById("bySchool"), D.by_school_grad);
  stackRows(document.getElementById("byMajorCat"), D.by_major_cat);
  stackRows(document.getElementById("byStem"), D.by_stem_sub, 8);
  stackRows(document.getElementById("byNonstem"), D.by_nonstem_sub, 6);
  stackRows(document.getElementById("byPort"), D.by_port, 12);
  stackRows(document.getElementById("byRole"), D.by_role);
  stackRows(document.getElementById("byVisa"), D.by_visa);
  stackRows(document.getElementById("byVisaStatus"), D.by_visa_status);
  stackRows(document.getElementById("byStay"), D.by_stay || []);
  document.getElementById("roomSub").textContent = t("roomSubT").replace("{n}", D.held_n);
  barRows(document.getElementById("questions"), D.questions, D.held_n);
  barRows(document.getElementById("durations"), D.durations, D.held_n);
  barRows(document.getElementById("devices"), D.devices, D.held_n);
  stories(document.getElementById("stories"), D.stories);
  document.getElementById("aboutList").innerHTML = t("about").map(x => `<li>${x.replace("{k}", D.min_n)}</li>`).join("");
  document.getElementById("updated").textContent = D.updated;
}

document.getElementById("cta").href = FORM_URL;
document.getElementById("langBtn").onclick = () => {
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("ue-lang", lang); } catch (e) {}
  render();
};
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("ue-theme", root.dataset.theme); } catch (e) {}
};

render();
fetch(new URLSearchParams(location.search).has("demo") ? "demo.json" : "data.json", { cache: "no-cache" }).then(r => r.json()).then(d => { D = d; render(); })
  .catch(() => { document.getElementById("kpis").innerHTML = `<p class="note">数据加载失败 / Failed to load data.</p>`; });
</script>
</body>
</html>
