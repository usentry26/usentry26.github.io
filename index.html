html { -webkit-text-size-adjust: 100%; }
body {

.cta-note { color: var(--text-3); font-size: 12.5px; margin-left: 10px; }

.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 0 0 12px; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px; min-width: 0; }

.row .n { font-size: 12px; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.more { font: inherit; font-size: 12.5px; color: var(--accent); background: none; border: 0; padding: 4px 0 0; cursor: pointer; }

.wide { margin-top: 12px; }
#unis .row { grid-template-columns: minmax(120px, 22%) 1fr 52px; }
.trendcard { margin: 0 0 12px; }
.tlegend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--text-2); margin: 0 0 6px; }
.tlegend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }

#trend .axis { font-size: 11px; fill: var(--text-3); }
#trend .gridl { stroke: var(--grid); stroke-width: 1; }

.tablewrap { overflow-x: auto; }

.story p { margin: 0; }

footer { color: var(--text-3); font-size: 12px; padding: 20px 0 36px; text-align: center; }

#tip { position: fixed; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .08s;

  sch: ["国防七子 / 军队院校", "其他可能涉及 10043 的高校", "其他国内高校 / 没有在国内读过大学"],
  stay: ["1 个月以内", "1 到 3 个月", "3 到 5 个月", "5 个月以上", "首次赴美（不适用）"],
  dur: ["30 分钟以内", "30 分钟到 1 小时", "1 到 3 小时", "3 到 6 小时", "6 小时以上"],
  dev: ["没有", "被要求解锁并当面翻看", "被拿走单独检查", "不确定"],
};
const FILTERS = [
  { k: "time", t: "f_time" }, { k: "o", t: "f_o" }, { k: "port", t: "f_port" }, { k: "visa", t: "f_visa" },
  { k: "vs", t: "f_vs" }, { k: "role", t: "f_role" }, { k: "mc", t: "f_mc" }, { k: "ms", t: "f_ms" },
  { k: "sch", t: "f_sch" }, { k: "stay", t: "f_stay" },
];

let lang = "zh", D = null, F = {};
const expanded = {}, CARD_DATA = {};
try { lang = localStorage.getItem("ue-lang") || "zh"; } catch (e) {}
try { const th = localStorage.getItem("ue-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

const t = (k, v = {}) => (T[lang][k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const L = k => { if (k == null) return "—"; if (lang === "zh") return k; if (EN[k]) return EN[k]; const m = /^([A-Z]{3}) /.exec(k); return m ? m[1] : k; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const vals = (r, k) => Array.isArray(r[k]) ? r[k] : (r[k] == null ? [] : [r[k]]);
const fmtWeek = s => { const d = new Date(s + "T00:00:00"); return lang === "zh" ? `${d.getMonth() + 1}/${d.getDate()}` : d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

const TIMES = { t_7: 7, t_14: 14, t_21: 21, t_30: 30, t_60: 60, t_90: 90, t_180: 180 };
function today() { return D && D.updated ? new Date(D.updated + "T00:00:00") : new Date(); }
function inTime(r, v) {
  if (!v) return true;
  const days = TIMES[v];
  const wkEnd = new Date(r.w + "T00:00:00"); wkEnd.setDate(wkEnd.getDate() + 6);
  return (today() - wkEnd) / 864e5 < days;
}
function filtered(skip) {
  return D.rows.filter(r => FILTERS.every(f => {
    if (!F[f.k] || f.k === skip) return true;
    if (f.k === "time") return inTime(r, F.time);
    return vals(r, f.k).includes(F[f.k]);
  }));
}

// ---------- tooltip ----------
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el || !el._tip) { tip.style.opacity = 0; return; }
  tip.innerHTML = el._tip; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect(), pad = 12;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
});

function tally(rows) { const c = { n: rows.length, pass: 0, held: 0, denied: 0, revoked: 0 }; rows.forEach(r => c[r.o]++); return c; }
function tipHtml(title, c) {
  return `<b>${esc(title)}</b>` + OUT.map(k => c[k] ? `<div class="r"><span><i style="background:var(${OC[k]})"></i>${t(k)}</span><span>${c[k]} · ${pct(c[k], c.n)}%</span></div>` : "").join("") +
    `<div class="r" style="color:var(--text-3);margin-top:3px"><span>${t("k_n")}</span><span>${c.n}</span></div>`;
}

// ---------- cards ----------
function group(rows, key, order) {
  const m = new Map();
  rows.forEach(r => vals(r, key).forEach(v => { if (!m.has(v)) m.set(v, []); m.get(v).push(r); }));
  const keys = [...m.keys()];
  if (order) keys.sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));
  else keys.sort((a, b) => m.get(b).length - m.get(a).length);
  return keys.map(k => ({ key: k, ...tally(m.get(k)) }));
}
function card(id, title, sub, data, opts = {}) {
  const limit = opts.limit, all = expanded[id];
  const list = limit && !all ? data.slice(0, limit) : data;
  const max = Math.max(1, ...data.map(d => d.n));
  const label = k => opts.label ? opts.label(k) : L(k);
  let h = `<div class="card"><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}`;
  if (!data.length || !data.some(d => d.n)) h += `<div class="empty">${t("noData")}</div>`;
  else h += list.map((d, i) => {
    const segs = OUT.map(k => d[k] ? `<span class="s-${k}" style="flex:${d[k]} 0 0;background:var(${OC[k]})">${d[k] / max > .04 ? d[k] : ""}</span>` : "").join("");
    return `<div class="row" data-tip data-c="${id}" data-i="${i}"><div class="lab" title="${esc(label(d.key))}">${esc(label(d.key))}</div>
      <div><div class="bar" style="width:${d.n ? Math.max(d.n / max * 100, 2) : 0}%">${segs}</div></div>
      <div class="n">${t("cases", { n: d.n })}</div></div>`;
  }).join("");
  if (limit && data.length > limit) h += `<button class="more" data-more="${id}">${all ? t("showLess") : t("showAll", { n: data.length })}</button>`;
  CARD_DATA[id] = { list, label };
  return h + "</div>";
}
function weeks(rows) {
  const end = today(); end.setDate(end.getDate() - ((end.getDay() + 6) % 7));
  const out = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(end); d.setDate(d.getDate() - 7 * i);
    const k = isoDate(d);
    out.push({ key: k, ...tally(rows.filter(r => r.w === k)) });
  }
  return out;
}

// ---------- render ----------
function renderFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = FILTERS.map(f => {
    let opts;
    if (f.k === "time") opts = Object.keys(TIMES).map(v => [v, `${t(v)} (${D.rows.filter(r => inTime(r, v)).length})`]);
    else if (f.k === "o") opts = OUT.map(v => [v, `${t(v)} (${D.rows.filter(r => r.o === v).length})`]);
    else opts = group(D.rows, f.k, ORDER[f.k]).map(d => [d.key, `${L(d.key)} (${d.n})`]);
    return `<div><label>${t(f.t)}</label><select data-f="${f.k}"><option value="">${t("all")}</option>${opts.map(([v, l]) => `<option value="${esc(v)}"${F[f.k] === v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
  }).join("");
  el.querySelectorAll("select").forEach(s => s.onchange = () => { F[s.dataset.f] = s.value; renderBody(); });
}

function renderBody() {
  const rows = filtered(), c = tally(rows);
  document.getElementById("fsum").textContent = t("fsum", { n: rows.length });
  document.getElementById("clearBtn").style.visibility = Object.values(F).some(Boolean) ? "visible" : "hidden";
  document.getElementById("kpis").innerHTML =
    `<div class="kpi"><div class="l">${t("k_n")}</div><div class="v">${c.n}</div><div class="s">${t("k_held")} ${pct(c.n - c.pass, c.n)}%</div></div>` +
    OUT.map(k => `<div class="kpi"><div class="l"><i style="background:var(${OC[k]})"></i>${t(k)}</div><div class="v">${c[k]}</div><div class="s">${t("k_of", { p: pct(c[k], c.n) })}</div></div>`).join("");

  const held = rows.filter(r => r.o !== "pass");
  const cards = document.getElementById("cards");
  cards.innerHTML = [
    card("week", t("c_week"), "", weeks(rows), { label: k => t("weekOf", { d: fmtWeek(k) }) }),
    card("port", t("c_port"), "", group(rows, "port"), { limit: 10 }),
    card("role", t("c_role"), "", group(rows, "role", ORDER.role)),
    card("sch", t("c_sch"), t("c_schSub"), group(rows, "sch", ORDER.sch)),
    card("mc", t("c_mc"), "", group(rows, "mc", ORDER.mc)),
    card("visa", t("c_visa"), "", group(rows, "visa", ORDER.visa)),
    card("stem", t("c_stem"), "", group(rows.filter(r => r.mc === "STEM"), "ms"), { limit: 10 }),
    card("non", t("c_non"), "", group(rows.filter(r => r.mc === "非 STEM"), "ms"), { limit: 10 }),
    card("vs", t("c_vs"), "", group(rows, "vs", ORDER.vs)),
    card("stay", t("c_stay"), "", group(rows, "stay", ORDER.stay)),
    card("q", t("c_q"), t("c_qSub"), group(held, "q")),
    card("dur", t("c_dur"), "", group(held, "dur", ORDER.dur)),
    card("dev", t("c_dev"), "", group(held, "dev", ORDER.dev)),
  ].join("");
  cards.querySelectorAll(".row").forEach(r => {
    const cd = CARD_DATA[r.dataset.c], d = cd.list[+r.dataset.i];
    r._tip = tipHtml(cd.label(d.key), d);
  });
  cards.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { expanded[b.dataset.more] = !expanded[b.dataset.more]; renderBody(); });
  renderCases(rows);
  renderTrend(filtered("time"));
}

function renderTrend(rows) {
  const W = 1000, H = 260, ml = 40, mr = 50, mt = 12, mb = 46, NB = 22;
  const pw = W - ml - mr, ph = H - mt - mb;
  const end = today(); end.setDate(end.getDate() - ((end.getDay() + 6) % 7));
  const NW = 16, wk = [];
  for (let i = NW - 1; i >= 0; i--) { const d = new Date(end); d.setDate(d.getDate() - 7 * i); const k = isoDate(d); wk.push({ k, ...tally(rows.filter(r => r.w === k)) }); }
  wk.forEach(w => { w.hr = w.n ? (w.n - w.pass) / w.n * 100 : null; w.dr = w.n ? (w.denied + w.revoked) / w.n * 100 : null; });
  const x = i => ml + (NW === 1 ? pw / 2 : i * pw / (NW - 1));
  const ymax = Math.max(20, Math.ceil(Math.max(0, ...wk.map(w => w.hr ?? 0)) / 20) * 20);
  const y = v => mt + ph - v / ymax * ph;
  const nmax = Math.max(1, ...wk.map(w => w.n));
  const series = [["hr", "--o-held", t("l_held")], ["dr", "--o-denied", t("l_den")]];
  let g = "";
  for (let v = 0; v <= ymax; v += ymax / 4) g += `<line class="gridl" x1="${ml}" x2="${ml + pw}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}%</text>`;
  wk.forEach((w, i) => { const bh = w.n / nmax * NB; g += `<rect class="nbar" x="${x(i) - 7}" y="${H - mb + 8 + NB - bh}" width="14" height="${bh}" rx="2"/>`; });
  wk.forEach((w, i) => { if (i % 2 === (NW - 1) % 2) g += `<text class="axis" x="${x(i)}" y="${H - 2}" text-anchor="middle">${fmtWeek(w.k)}</text>`; });
  series.forEach(([key, col, name]) => {
    const pts = wk.map((w, i) => w[key] == null ? null : [x(i), y(w[key]), w.n]);
    let d = "", pen = false;
    pts.forEach(p => { if (!p) { pen = false; return; } d += (pen ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke="var(${col})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p => { if (p) g += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${p[2] < 5 ? "var(--surface)" : `var(${col})`}" stroke="var(${col})" stroke-width="2"/>`; });
    const last = [...pts].reverse().find(Boolean);
    if (last) g += `<text x="${last[0] + 10}" y="${last[1] + 4}" font-size="12" fill="var(--text)">${Math.round(wk[pts.lastIndexOf(last)][key])}%</text>`;
  });
  wk.forEach((w, i) => g += `<rect data-tip data-wi="${i}" x="${x(i) - pw / (NW - 1) / 2}" y="${mt}" width="${pw / (NW - 1)}" height="${H - mt}" fill="transparent"/>`);
  const el = document.getElementById("trend");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("trendH")}">${g}</svg>`;
  el.querySelectorAll("[data-wi]").forEach(r => {
    const w = wk[+r.dataset.wi];
    r._tip = `<b>${t("weekOf", { d: fmtWeek(w.k) })}</b>` + (w.n ? series.map(([k, c, n]) => `<div class="r"><span><i style="background:var(${c})"></i>${n}</span><span>${Math.round(w[k])}%</span></div>`).join("") : "") +
      `<div class="r" style="color:var(--text-3);margin-top:3px"><span>${t("k_n")}</span><span>${w.n}</span></div>`;
  });
  document.getElementById("tlegend").innerHTML = series.map(([k, c, n]) => `<span><i style="background:var(${c})"></i>${n}</span>`).join("") + `<span><i class="hollow"></i>${t("l_low")}</span>`;
}

function renderUnis() {
  const list0 = D.unis || [];
  document.getElementById("uniSec").hidden = !list0.length;
  document.getElementById("uniSub").textContent = t("uniSub", { k: D.min_n || 3 });
  const all = expanded.unis, list = all ? list0 : list0.slice(0, 15);
  const max = Math.max(1, ...list0.filter(d => d.key !== "__other__").map(d => d.n));
  const lab = k => k === "__other__" ? t("otherUni", { k: D.min_n || 3 }) : k;
  const el = document.getElementById("unis");
  el.innerHTML = list.map((d, i) => {
    const segs = OUT.map(k => d[k] ? `<span class="s-${k}" style="flex:${d[k]} 0 0;background:var(${OC[k]})">${d[k] / max > .03 ? d[k] : ""}</span>` : "").join("");
    return `<div class="row uni" data-tip data-i="${i}"><div class="lab">${esc(lab(d.key))}</div><div><div class="bar" style="width:${Math.min(100, Math.max(d.n / max * 100, 2))}%">${segs}</div></div><div class="n">${t("cases", { n: d.n })}</div></div>`;
  }).join("") + (list0.length > 15 ? `<button class="more" id="uniMore">${all ? t("showLess") : t("showAll", { n: list0.length })}</button>` : "");
  el.querySelectorAll(".row").forEach(r => { const d = list[+r.dataset.i]; r._tip = tipHtml(lab(d.key), d); });
  const b = document.getElementById("uniMore"); if (b) b.onclick = () => { expanded.unis = !expanded.unis; renderUnis(); };
}

function renderCases(rows) {
  const el = document.getElementById("cases");
  if (!rows.length) { el.innerHTML = `<div class="empty">${t("noData")}</div>`; return; }
  const all = expanded.cases, list = all ? rows : rows.slice(0, 15);
  el.innerHTML = `<table class="cases"><thead><tr><th>${t("th_w")}</th><th>${t("th_o")}</th><th>${t("th_port")}</th><th>${t("th_visa")}</th><th>${t("th_role")}</th><th class="hide-sm">${t("th_major")}</th><th class="hide-sm">${t("th_stay")}</th><th class="hide-sm">${t("th_dur")}</th></tr></thead><tbody>` +
    list.map(r => `<tr><td>${fmtWeek(r.w)}</td><td><span class="pill" style="--c:var(${OC[r.o]})">${t(r.o)}</span></td><td>${esc(L(r.port))}</td><td>${esc(r.visa || "—")}</td><td>${esc(L(r.role))}</td><td class="hide-sm">${esc(L(r.ms || r.mc))}</td><td class="hide-sm">${esc(L(r.stay))}</td><td class="hide-sm">${r.dur ? esc(L(r.dur)) : ""}</td></tr>`).join("") +
    `</tbody></table>` + (rows.length > 15 ? `<button class="more" id="casesMore">${all ? t("showLess") : t("showAll", { n: rows.length })}</button>` : "");
  const b = document.getElementById("casesMore"); if (b) b.onclick = () => { expanded.cases = !expanded.cases; renderCases(rows); };
}

function render() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";
  document.getElementById("legend").innerHTML = OUT.map(k => `<span><i style="background:var(${OC[k]})"></i>${t(k)}</span>`).join("");
  document.getElementById("foot").textContent = t("footer");
  if (!D) return;
  document.getElementById("meta").textContent = t("meta", { u: D.updated, n: D.rows.length });
  const ban = document.getElementById("demoBanner"); ban.hidden = !D.demo; ban.textContent = t("demo");
  renderFilters();
  renderBody();
  renderUnis();
  document.getElementById("storySec").hidden = !D.stories.length;
  document.getElementById("stories").innerHTML = D.stories.map(s => `<div class="story"><div class="m"><span>${esc(s.month)}</span><span class="pill" style="--c:var(${OC[s.o]})">${t(s.o)}</span>${[s.visa, s.role, s.mc, s.dur].filter(Boolean).map(x => `<span>${esc(L(x))}</span>`).join("")}</div><p>${esc(s.text)}</p></div>`).join("");
}

document.getElementById("cta").href = FORM_URL;
document.getElementById("clearBtn").onclick = () => { F = {}; renderFilters(); renderBody(); };
document.getElementById("langBtn").onclick = () => { lang = lang === "zh" ? "en" : "zh"; try { localStorage.setItem("ue-lang", lang); } catch (e) {} render(); };
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("ue-theme", root.dataset.theme); } catch (e) {}
};
render();
fetch(new URLSearchParams(location.search).has("demo") ? "demo.json" : "data.json", { cache: "no-cache" })
  .then(r => r.json()).then(d => { D = d; render(); })
  .catch(() => { document.getElementById("kpis").innerHTML = `<p class="empty">数据加载失败 / Failed to load data.</p>`; });
</script>
</body>
</html>
